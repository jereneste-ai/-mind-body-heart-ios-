name: Verify Adis iPhone release
on:
  workflow_dispatch:
  push:
    paths:
      - 'adis/**'
      - '.github/workflows/adis-release.yml'
permissions:
  contents: read
jobs:
  release-archive:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Archive for a physical iPhone without signing
        run: |
          set -o pipefail
          xcodebuild -project adis/Adis.xcodeproj -scheme Adis \
            -configuration Release -destination 'generic/platform=iOS' \
            -archivePath build/Adis.xcarchive \
            CODE_SIGNING_ALLOWED=NO archive | tee release-build.log
      - name: Preserve unsigned release archive
        run: ditto -c -k --sequesterRsrc --keepParent build/Adis.xcarchive Adis-unsigned-release.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Adis-unsigned-iPhone-release
          path: Adis-unsigned-release.zip
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Adis-release-build-log
          path: release-build.log
