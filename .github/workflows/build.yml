name: Mobile build checks
on: [push, workflow_dispatch]
permissions:
  contents: read
jobs:
  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen
      - run: cd oma-tahti/ios && xcodegen generate && xcodebuild -project OmaTahti.xcodeproj -scheme OmaTahti -sdk iphonesimulator -configuration Debug -derivedDataPath build CODE_SIGNING_ALLOWED=NO build
      - uses: actions/upload-artifact@v4
        with:
          name: ios-simulator-only
          path: oma-tahti/ios/build/Build/Products/Debug-iphonesimulator/OmaTahti.app
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - run: cd oma-tahti/android && gradle :app:assembleDebug :app:bundleRelease :app:lintDebug
      - uses: actions/upload-artifact@v4
        with:
          name: android-debug-and-unsigned-bundle
          path: |
            oma-tahti/android/app/build/outputs/apk/debug/*.apk
            oma-tahti/android/app/build/outputs/bundle/release/*.aab
