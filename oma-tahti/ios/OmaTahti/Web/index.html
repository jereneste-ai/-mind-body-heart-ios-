<!doctype html>
<html lang="fi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="description" content="Hyvinn Kirjaus — journal and wellbeing tracking for mind, body, heart, and everyday life." />
    <title>Hyvinn Kirjaus</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <div class="brand-block">
          <div class="brand-mark">H</div>
          <div>
            <p class="brand-label">Hyvinn</p>
            <h1>Kirjaus</h1>
          </div>
        </div>

        <div class="top-actions">
          <button id="saveBtn" class="ghost" type="button">Tallenna</button>
          <button id="exportBtn" class="primary" type="button">Vie</button>
        </div>
      </header>

      <main class="layout">
        <section class="card hero">
          <div class="eyebrow">Mind • Body • Heart • Everyday Life</div>
          <h2>Hyvinvoinnin päiväkirja</h2>
          <p>
            Kirjaa päivän tunnelma, energia, ruumiilliset signaalit, huolenaiheet ja
            seuraava askel kohti tasapainoisempaa arkea.
          </p>
          <div class="hero-metrics" id="heroMetrics"></div>
        </section>

        <section class="card checkin-panel">
          <div class="section-header">
            <h3>Päivän tarkistus</h3>
            <div id="todayDate" class="pill"></div>
          </div>

          <div class="mood-row" id="moodRow"></div>

          <div class="form-grid">
            <label>
              Energia
              <input id="energy" type="range" min="1" max="10" value="7" />
              <span id="energyValue">7/10</span>
            </label>

            <label>
              Uni
              <input id="sleep" type="range" min="1" max="10" value="6" />
              <span id="sleepValue">6/10</span>
            </label>
          </div>

          <div class="field-group">
            <label for="reflection">Mitä tänään koen?</label>
            <textarea id="reflection" placeholder="Esimerkiksi: Olen rauhallinen, mutta väsyttää..."></textarea>
          </div>

          <div class="field-group">
            <label for="support">Mitä tuki minua?</label>
            <textarea id="support" placeholder="Esimerkiksi: Hyvä ruokailu, rauhallinen kävely, ystävän puhelu..."></textarea>
          </div>

          <div class="field-group">
            <label for="nextStep">Mikä on seuraava askel?</label>
            <textarea id="nextStep" placeholder="Esimerkiksi: Kaikki ei tarvitse hoitaa kerralla. Pidän yhden rauhallisen tauon."></textarea>
          </div>

          <button id="saveEntryBtn" class="primary wide" type="button">Tallenna merkintä</button>
        </section>

        <section class="card entries-panel">
          <div class="section-header">
            <h3>Merkinnät</h3>
            <button id="clearBtn" class="ghost small" type="button">Tyhjennä</button>
          </div>
          <div id="entriesList" class="entries-list"></div>
        </section>
      </main>
    </div>

    <div id="status" class="status" aria-live="polite"></div>

    <script src="app.js"></script>
  </body>
</html>
